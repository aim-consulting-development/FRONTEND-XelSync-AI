services:
  xelsync-frontend:
    build:
      context: ./frontend-xelsync-ai
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: xelsync-frontend-app
    networks:
      - xelsync_net
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1

  nginx:
    image: nginx:alpine
    container_name: xelsync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xelsync_net
    depends_on:
      - xelsync-frontend

networks:
  xelsync_net:
    external: true
    name: xelsync_network

services:
  xelsync-frontend:
    build:
      context: ./frontend-xelsync-ai
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.1.72:8000/api/v1
    container_name: xelsync-frontend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://192.168.1.72:8000/api/v1

services:
  xelsync-frontend:
    build:
      context: ./frontend-xelsync-ai
      dockerfile: Dockerfile
      target: deps
    container_name: xelsync-frontend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend-xelsync-ai:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

